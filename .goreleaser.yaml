version: 2

builds:
  - main: ./cmd/sonarless-mcp
    binary: sonarless-mcp
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - name_template: "sonarless-mcp_{{ .Os }}_{{ .Arch }}" # stable names for releases/latest/download
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
