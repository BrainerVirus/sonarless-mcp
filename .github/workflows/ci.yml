name: ci

# Runs on pull requests, and as the gate inside release.yml for pushes to main.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Conventional Commits drive the version bump and release notes.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: commitlint
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          from="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last
          else
            npx commitlint --from "$from" --to HEAD
          fi

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build ./cmd/sonarless-mcp

  # Builds a snapshot release and installs it with the real install scripts,
  # so install.sh and install.ps1 are exercised on every OS they target.
  installers:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      # The single entry point (`install`) is valid sh and PowerShell; run it
      # the way users do, against the snapshot built above.
      - name: install (sh, piped like curl | sh)
        if: runner.os != 'Windows'
        env:
          SONARLESS_MCP_SCRIPTS_BASE: file://${{ github.workspace }}
          SONARLESS_MCP_BASE_URL: file://${{ github.workspace }}/dist
          SONARLESS_MCP_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh < install
          "$SONARLESS_MCP_INSTALL_DIR/sonarless-mcp" --version
          for shell in bash dash zsh; do
            if command -v "$shell" >/dev/null; then "$shell" < install >/dev/null && echo "$shell ok"; fi
          done
      - name: install (PowerShell 7, like irm | iex)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SONARLESS_MCP_INSTALL_DIR: ${{ runner.temp }}\bin7
        run: |
          $env:SONARLESS_MCP_SCRIPTS_BASE = "file:///$($env:GITHUB_WORKSPACE -replace '\\','/')"
          $env:SONARLESS_MCP_BASE_URL = "$env:SONARLESS_MCP_SCRIPTS_BASE/dist"
          Get-Content -Raw ./install | Invoke-Expression
          & "$env:SONARLESS_MCP_INSTALL_DIR\sonarless-mcp.exe" --version
      - name: install (Windows PowerShell 5.1, like irm | iex)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SONARLESS_MCP_INSTALL_DIR: ${{ runner.temp }}\bin5
        run: |
          $env:SONARLESS_MCP_SCRIPTS_BASE = "file:///$($env:GITHUB_WORKSPACE -replace '\\','/')"
          $env:SONARLESS_MCP_BASE_URL = "$env:SONARLESS_MCP_SCRIPTS_BASE/dist"
          Get-Content -Raw ./install | Invoke-Expression
          & "$env:SONARLESS_MCP_INSTALL_DIR\sonarless-mcp.exe" --version
